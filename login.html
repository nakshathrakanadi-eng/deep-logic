<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CampusEats</title>

  <!-- Google Fonts (loaded here so login page works even without style.css) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* ── CSS Variables (duplicated here so login works standalone) ── */
    :root {
      --primary:      #ff6b35;
      --primary-dark: #e55a25;
      --primary-light:#fff0eb;
      --bg:           #fffaf7;
      --surface:      #ffffff;
      --surface2:     #f7f3ef;
      --text:         #1a1208;
      --text2:        #6b5c4e;
      --muted:        #b5a498;
      --border:       #ede5de;
      --radius:       16px;
      --radius-sm:    10px;
      --shadow-lg:    0 12px 48px rgba(255,107,53,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* FIX 1: Removed the invalid "bgcolor:sky rgb(...)" garbage */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffe8d6; /* warm light orange background */
      font-family: 'Nunito', sans-serif;
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      display: block;
      margin-bottom: 0.4rem;
    }

    .auth-tagline {
      color: var(--text2);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }

    .auth-tabs {
      display: flex;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 1.8rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.2s;
      color: var(--text2);
      border: none;
      background: transparent;
      font-family: 'Nunito', sans-serif;
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .auth-form-section { display: none; flex-direction: column; gap: 1.1rem; }
    .auth-form-section.active { display: flex; }

    /* Form fields */
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text2);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,107,53,0.35); }
    .btn-full { width: 100%; }
    .btn-lg { padding: 0.85rem 2rem; font-size: 1rem; border-radius: var(--radius); }

    /* FIX 2: Loading state for buttons */
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

    .admin-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }
    .admin-link:hover { color: var(--primary); }

    /* FIX 3: Toast styles (were missing — caused toasts to be invisible) */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      padding: 0.85rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      max-width: 300px;
      color: white;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease;
    }
    .toast-error   { background: #991b1b; }
    .toast-success { background: #166534; }
    .toast-info    { background: #1e3a5f; }

    @keyframes slideIn {
      from { transform: translateX(100px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
  </style>
</head>
<body>

<div class="auth-wrap">

  <div class="auth-header">
    <span class="auth-logo">🍽 CampusEats</span>
    <p class="auth-tagline">Assignments later, Snacks first!! 😄</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="auth-form-section active" id="tab-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@college.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="login()">
        Login
      </button>
    </div>

    <!-- SIGNUP FORM -->
    <div class="auth-form-section" id="tab-signup">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@college.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters">
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="signup-btn" onclick="signup()">
        Create Account
      </button>
    </div>
  </div>

  <a href="admin/login.html" class="admin-link">🔒 Canteen Staff Login →</a>
</div>

<div id="toast-container"></div>

<!-- Firebase SDKs (compat version — matches your firebase-config.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<!-- FIX 4: These must come AFTER Firebase SDKs, in this exact order -->
<script src="js/firebase-config.js"></script>

<script>
  // ── Toast helper (defined before use) ──────────────────────────────
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  // ── Redirect if already logged in ──────────────────────────────────
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'index.html';
  });

  // ── Tab switcher ───────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
    });
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  }

  // ── Login ──────────────────────────────────────────────────────────
  async function login() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) return showToast('Please fill in all fields', 'error');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      await auth.signInWithEmailAndPassword(email, password);
      showToast('Welcome back! 👋', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    } catch (e) {
      // FIX 5: Show friendly error messages instead of raw Firebase errors
      const msg = friendlyError(e.code);
      showToast(msg, 'error');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }

  // ── Signup ─────────────────────────────────────────────────────────
  async function signup() {
    const name     = document.getElementById('signup-name').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;

    if (!name || !email || !password) return showToast('Please fill in all fields', 'error');
    if (password.length < 6) return showToast('Password must be at least 6 characters', 'error');

    const btn = document.getElementById('signup-btn');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);

      await cred.user.updateProfile({ displayName: name });

      // Save user info to Firestore
      await db.collection('users').doc(cred.user.uid).set({
        name,
        email,
        role: 'student',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showToast('Account created! Welcome 🎉', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    } catch (e) {
      const msg = friendlyError(e.code);
      showToast(msg, 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  // ── Friendly Firebase error messages ──────────────────────────────
  function friendlyError(code) {
    const errors = {
      'auth/user-not-found':       'No account found with this email.',
      'auth/wrong-password':       'Incorrect password. Try again.',
      'auth/email-already-in-use': 'This email is already registered. Try logging in.',
      'auth/invalid-email':        'Please enter a valid email address.',
      'auth/weak-password':        'Password is too weak. Use at least 6 characters.',
      'auth/too-many-requests':    'Too many attempts. Please wait and try again.',
      'auth/network-request-failed': 'Network error. Check your internet connection.',
    };
    return errors[code] || 'Something went wrong. Please try again.';
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Canteen</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f6f9}
header{background:#91b7e7;color:#fff;padding:15px 40px;display:flex;justify-content:space-between;align-items:center}
nav button{margin-left:8px;padding:6px 12px;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
section{padding:40px}
.menu-container{display:flex;flex-wrap:wrap;gap:20px}
.card{background:#fff;width:220px;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.price{font-weight:bold}
.available{color:green;font-weight:bold}
.out{color:red;font-weight:bold}
.card button{margin-top:10px;padding:6px 12px;border:none;border-radius:5px;background:#ff6b00;color:#fff;cursor:pointer}
.card button:disabled{background:gray;cursor:not-allowed}
.cart{background:#fff;padding:20px;border-radius:10px;margin-top:30px}
footer{text-align:center;padding:15px;background:#333;color:#fff;margin-top:40px}
</style>
</head>

<body>

<header>
  <h2>🍔 Campus Canteen</h2>
  <nav>
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Snacks')">Snacks</button>
    <button onclick="filterCategory('Cool Drinks')">Cool Drinks</button>
    <button onclick="filterCategory('Veg')">Veg</button>
    <button onclick="filterCategory('Non-Veg')">Non-Veg</button>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<section>
<h2>Menu</h2>
<div class="menu-container" id="menu"></div>

<div class="cart">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <p><strong>Total: ₹<span id="total">0</span></strong></p>
  <button onclick="clearCart()" style="background:red;color:white">Clear Cart</button>
</div>

<button onclick="placeOrder()" style="margin-top:15px;background:green;color:white;padding:8px 16px;border:none;border-radius:5px">
Place Order
</button>
</section>

<!-- ORDER MODAL -->
<div id="orderConfirmation"
     style="display:none;position:fixed;inset:0;
            background:rgba(0,0,0,.6);
            justify-content:center;align-items:center">

  <div style="background:white;padding:20px;border-radius:10px;width:300px;text-align:center">
    <h2>✅ Order Placed</h2>
    <p id="orderId"></p>
    <p id="pickupTime"></p>
    <div id="orderSummary"></div>
    <button onclick="closeOrderModal()" style="margin-top:10px">Close</button>
  </div>

<footer>© 2026 College Canteen</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script>
// ---------- AUTH ----------
firebase.auth().onAuthStateChanged(user=>{
  if(!user) location.href="login.html";
});

document.getElementById("orderConfirmation").style.display = "none";

// ---------- DATA ----------
const foodItems=[
 {name:"Samosa",category:"Snacks",price:20,stock:5},
 {name:"Burger",category:"Snacks",price:40,stock:0},
 {name:"Coke",category:"Cool Drinks",price:30,stock:6},
 {name:"Veg Meals",category:"Veg",price:80,stock:2},
 {name:"Chicken Biryani",category:"Non-Veg",price:120,stock:4}
];

let cart=[];

// ---------- MENU ----------
function displayMenu(items){
 const menu=document.getElementById("menu");
 menu.innerHTML="";
 items.forEach((item,i)=>{
   const out=item.stock===0;
   menu.innerHTML+=`
    <div class="card">
      <h3>${item.name}</h3>
      <p>${item.category}</p>
      <p class="price">₹${item.price}</p>
      <p class="${out?'out':'available'}">
        ${out?'Out of Stock':`Available (${item.stock})`}
      </p>
      <button ${out?'disabled':''} onclick="addToCart(${i})">Add to Cart</button>
    </div>`;
 });
}

// ---------- FILTER ----------
function filterCategory(cat){
 displayMenu(cat==="All"?foodItems:foodItems.filter(f=>f.category===cat));
}

// ---------- CART ----------
function addToCart(i){
 if(foodItems[i].stock<=0) return;
 cart.push(foodItems[i]);
 foodItems[i].stock--;
 updateCart();
 displayMenu(foodItems);
}

function updateCart(){
 const div=document.getElementById("cartItems");
 const total=document.getElementById("total");
 div.innerHTML="";
 let sum=0;
 cart.forEach(item=>{
   sum+=item.price;
   div.innerHTML+=`<p>${item.name} - ₹${item.price}</p>`;
 });
 total.innerText=sum;
}

function clearCart(){
 cart=[];
 updateCart();
}

// ---------- ORDER ----------
function placeOrder(){
 if(cart.length===0){alert("Cart is empty");return;}
 const id="ORD-"+Math.floor(Math.random()*1000000);
 const pickup=new Date();
 pickup.setMinutes(pickup.getMinutes()+15);

 document.getElementById("orderId").innerText="Order ID: "+id;
 document.getElementById("pickupTime").innerText="Pickup: "+pickup.toLocaleTimeString();
 const s=document.getElementById("orderSummary");
 s.innerHTML="<strong>Items:</strong>";
 cart.forEach(i=>s.innerHTML+=`<p>${i.name}</p>`);

 document.getElementById("orderConfirmation").style.display="flex";
 cart=[];
 updateCart();
}

function closeOrderModal(){
 document.getElementById("orderConfirmation").style.display="none";
}

// ---------- LOGOUT ----------
function logout(){
 firebase.auth().signOut().then(()=>location.href="login.html");
}

displayMenu(foodItems);
</script>

</body>
</html>
